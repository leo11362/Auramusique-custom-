name: AuraMusique Desktop
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: local.properties
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:createDistributable
      - name: Pack
        shell: bash
        run: |
          cd desktopApp/build/compose/binaries/main/app
          ls
          7z a -tzip "$GITHUB_WORKSPACE/AuraMusique-Desktop-${{ runner.os }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: AuraMusique-${{ runner.os }}
          path: AuraMusique-Desktop-${{ runner.os }}.zip
